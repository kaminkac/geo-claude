<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Europy — Quiz Geograficzny</title>
  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MapTiler SDK + Leaflet plugin (polskie etykiety) -->
  <link rel="stylesheet" href="https://unpkg.com/@maptiler/sdk/dist/maptiler-sdk.css" />
  <script src="https://unpkg.com/@maptiler/sdk/dist/maptiler-sdk.umd.min.js"></script>
  <script src="https://unpkg.com/@maptiler/leaflet-maptilersdk/dist/leaflet-maptilersdk.umd.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== EKRAN: MENU ===================== -->
  <div id="screen-menu" class="screen active">
    <div class="menu-container">
      <h1 class="app-title">Mapa Europy</h1>
      <p class="app-subtitle">Ćwiczenia z geografii</p>

      <div class="menu-card">
        <div class="menu-section">
          <label class="section-label">Wybierz kategorię</label>
          <div id="category-list" class="category-list">
            <!-- wypełniane przez JS -->
          </div>
        </div>

        <div class="menu-stats" id="menu-stats">
          <!-- statystyki sesji -->
        </div>

        <button class="btn-start" onclick="startQuiz()">Ćwicz!</button>
      </div>
    </div>
  </div>

  <!-- ===================== EKRAN: QUIZ (pytanie + odpowiedź) ===================== -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-layout">

      <!-- Panel sterowania — zmienia stan: pytanie / odpowiedź -->
      <div class="quiz-panel" id="quiz-panel">

        <!-- Stan: pytanie -->
        <div id="panel-question">
          <div class="panel-top">
            <button class="btn-sm" onclick="goToMenu()">← Menu</button>
            <div class="panel-meta">
              <span class="cat-pill" id="q-category-badge">—</span>
              <span class="prog-text" id="q-progress">1/10</span>
            </div>
            <button class="btn-sm btn-muted" onclick="nextQuestion()">Pomiń →</button>
          </div>
          <div class="panel-bottom">
            <div class="q-text">
              <span class="q-prefix">Gdzie jest:</span>
              <strong class="q-name" id="question-name">— — —</strong>
            </div>
            <button class="btn-action" onclick="showAnswer()">Pokaż</button>
          </div>
        </div>

        <!-- Stan: odpowiedź -->
        <div id="panel-answer" class="hidden">
          <div class="panel-top">
            <button class="btn-sm" onclick="goToMenu()">← Menu</button>
            <div class="panel-meta">
              <span class="cat-pill" id="a-category-badge">—</span>
              <span class="prog-text" id="a-progress">1/10</span>
            </div>
            <div></div>
          </div>
          <div class="panel-bottom">
            <div class="q-text">
              <span class="q-prefix">Odpowiedź:</span>
              <strong class="q-name" id="answer-name">— — —</strong>
              <span class="q-country" id="answer-country"></span>
            </div>
            <div class="answer-btns">
              <button class="btn-action" onclick="nextQuestion()">Następne →</button>
              <button class="btn-sm" onclick="goToMenu()">Zmień</button>
            </div>
          </div>
        </div>

      </div><!-- /.quiz-panel -->

      <!-- Mapa Leaflet — wspólna dla pytania i odpowiedzi -->
      <main class="map-area">
        <div id="quiz-map"></div>
      </main>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
