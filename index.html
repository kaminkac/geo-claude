<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Europy — Quiz Geograficzny</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== EKRAN: MENU ===================== -->
  <div id="screen-menu" class="screen active">
    <div class="menu-container">
      <h1 class="app-title">🗺️ Mapa Europy</h1>
      <p class="app-subtitle">Ćwiczenia z geografii</p>

      <div class="menu-card">
        <div class="menu-section">
          <label class="section-label" for="category-select">Wybierz kategorię</label>
          <select id="category-select" class="styled-select">
            <option value="all">Wszystkie kategorie</option>
            <option value="oceans">Oceany</option>
            <option value="seas">Morza</option>
            <option value="bays">Zatoki</option>
            <option value="straits">Cieśniny</option>
            <option value="channels">Kanały</option>
            <option value="islands">Wyspy</option>
            <option value="peninsulas">Półwyspy</option>
            <option value="mountains">Góry</option>
            <option value="uplands">Wyżyny</option>
            <option value="lowlands">Niziny</option>
            <option value="rivers">Rzeki</option>
            <option value="lakes">Jeziora</option>
          </select>
        </div>

        <button class="btn-start" onclick="startQuiz()">Ćwicz!</button>
      </div>
    </div>
  </div>

  <!-- ===================== EKRAN: PYTANIE ===================== -->
  <div id="screen-question" class="screen">
    <div class="quiz-layout">

      <header class="quiz-header">
        <button class="btn-back" onclick="goToMenu()">← Menu</button>
        <div class="category-badge" id="category-badge">Morza</div>
        <button class="btn-next-header" id="btn-skip" onclick="nextQuestion()">Pomiń →</button>
      </header>

      <div class="question-bar">
        <span class="question-prefix">Gdzie znajduje się:</span>
        <strong class="question-name" id="question-name">— — —</strong>
      </div>

      <main class="map-area" id="map-question">
        <div class="map-placeholder">
          <span>Mapa Europy</span>
          <small>(ładowana w Etapie 2)</small>
        </div>
      </main>

      <footer class="quiz-footer">
        <p class="instruction-text">Wskaż miejsce na mapie, a potem sprawdź odpowiedź.</p>
        <button class="btn-reveal" onclick="showAnswer()">Pokaż odpowiedź</button>
      </footer>

    </div>
  </div>

  <!-- ===================== EKRAN: ODPOWIEDŹ ===================== -->
  <div id="screen-answer" class="screen">
    <div class="quiz-layout">

      <header class="quiz-header">
        <button class="btn-back" onclick="goToMenu()">← Menu</button>
        <div class="category-badge" id="answer-category-badge">Morza</div>
        <div></div><!-- spacer -->
      </header>

      <div class="question-bar answer-bar">
        <span class="question-prefix">Odpowiedź:</span>
        <strong class="question-name" id="answer-name">— — —</strong>
      </div>

      <main class="map-area" id="map-answer">
        <div class="map-placeholder answer-placeholder">
          <span>Mapa z zaznaczonym obiektem</span>
          <small>(ładowana w Etapie 3)</small>
        </div>
      </main>

      <footer class="quiz-footer answer-footer">
        <button class="btn-next" onclick="nextQuestion()">Następne pytanie →</button>
        <button class="btn-secondary" onclick="goToMenu()">Zmień kategorię</button>
      </footer>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
