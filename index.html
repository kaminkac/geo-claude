<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Europy — Quiz Geograficzny</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== EKRAN: MENU GŁÓWNE ===================== -->
  <div id="screen-menu" class="screen active">
    <div class="menu-container">
      <h1 class="app-title">🗺️ Mapa Europy</h1>
      <p class="app-subtitle">Quiz geograficzny</p>

      <div class="menu-card">

        <!-- Wybór kategorii -->
        <div class="menu-section">
          <label class="section-label" for="category-select">Kategoria</label>
          <select id="category-select" class="styled-select">
            <option value="all">Wszystkie kategorie</option>
            <option value="oceans">Oceany</option>
            <option value="seas">Morza</option>
            <option value="bays">Zatoki</option>
            <option value="straits">Cieśniny</option>
            <option value="channels">Kanały</option>
            <option value="islands">Wyspy</option>
            <option value="peninsulas">Półwyspy</option>
            <option value="mountains">Góry</option>
            <option value="uplands">Wyżyny</option>
            <option value="lowlands">Niziny</option>
            <option value="rivers">Rzeki</option>
            <option value="lakes">Jeziora</option>
          </select>
        </div>

        <!-- Wybór poziomu trudności -->
        <div class="menu-section">
          <span class="section-label">Poziom trudności</span>
          <div class="btn-group" id="difficulty-group">
            <button class="btn-toggle active" data-value="easy" onclick="selectDifficulty(this)">
              🟢 Łatwy
            </button>
            <button class="btn-toggle" data-value="hard" onclick="selectDifficulty(this)">
              🔴 Trudny
            </button>
          </div>
          <p class="hint" id="difficulty-hint">
            Elementy kategorii są zaznaczone na mapie — kliknij właściwy.
          </p>
        </div>

        <!-- Wybór trybu gry -->
        <div class="menu-section">
          <span class="section-label">Tryb gry</span>
          <div class="btn-group" id="mode-group">
            <button class="btn-toggle active" data-value="endless" onclick="selectMode(this)">
              ♾️ Ciągły
            </button>
            <button class="btn-toggle" data-value="ten" onclick="selectMode(this)">
              🔟 Do 10 pytań
            </button>
          </div>
        </div>

        <!-- Przycisk Start -->
        <button class="btn-start" onclick="startGame()">
          Zagraj!
        </button>

      </div>
    </div>
  </div>

  <!-- ===================== EKRAN: GRA ===================== -->
  <div id="screen-game" class="screen">
    <div class="game-layout">

      <!-- Pasek górny -->
      <header class="game-header">
        <button class="btn-back" onclick="goToMenu()">← Menu</button>
        <div class="question-box">
          <span class="question-label">Wskaż na mapie:</span>
          <span class="question-text" id="question-text">— — —</span>
        </div>
        <div class="score-box">
          <span class="score-label">Punkty</span>
          <span class="score-value" id="score-value">0</span>
          <span class="score-progress" id="score-progress"></span>
        </div>
      </header>

      <!-- Obszar mapy -->
      <main class="map-area" id="map-area">
        <div class="map-placeholder">
          <p>Mapa zostanie załadowana w Etapie 2</p>
        </div>
      </main>

      <!-- Pasek dolny: feedback -->
      <div class="feedback-bar" id="feedback-bar">
        <span id="feedback-text"></span>
      </div>

    </div>
  </div>

  <!-- ===================== EKRAN: WYNIKI (tryb "Do 10") ===================== -->
  <div id="screen-results" class="screen">
    <div class="results-container">
      <div class="results-card">
        <h2 class="results-title">Koniec gry!</h2>

        <div class="results-score-display">
          <span class="results-score" id="results-score">0</span>
          <span class="results-max">/ 10</span>
        </div>

        <p class="results-message" id="results-message">Dobra robota!</p>

        <div class="results-buttons">
          <button class="btn-start" onclick="playAgain()">
            Zagraj jeszcze raz
          </button>
          <button class="btn-secondary" onclick="goToMenu()">
            Zmień ustawienia
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
