<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Europy — Quiz Geograficzny</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== EKRAN: MENU ===================== -->
  <div id="screen-menu" class="screen active">
    <div class="menu-container">
      <h1 class="app-title">Mapa Europy</h1>
      <p class="app-subtitle">Ćwiczenia z geografii</p>

      <div class="menu-card">
        <div class="menu-section">
          <label class="section-label">Wybierz kategorię</label>
          <div id="category-list" class="category-list">
            <!-- wypełniane przez JS -->
          </div>
        </div>

        <div class="menu-stats" id="menu-stats">
          <!-- statystyki sesji: liczba pytań itd. -->
        </div>

        <button class="btn-start" onclick="startQuiz()">Ćwicz!</button>
      </div>
    </div>
  </div>

  <!-- ===================== EKRAN: PYTANIE ===================== -->
  <div id="screen-question" class="screen">
    <div class="quiz-layout">

      <header class="quiz-header">
        <button class="btn-back" onclick="goToMenu()">← Menu</button>
        <div class="header-center">
          <span class="category-badge" id="q-category-badge">—</span>
          <span class="progress-text" id="q-progress">1 / 10</span>
        </div>
        <button class="btn-skip" onclick="nextQuestion()">Pomiń →</button>
      </header>

      <div class="question-bar">
        <span class="question-prefix">Gdzie znajduje się:</span>
        <strong class="question-name" id="question-name">— — —</strong>
      </div>

      <main class="map-area">
        <div class="map-wrapper">
          <img
            src="assets/maps/Europe_blank_map.png"
            class="map-img"
            alt="Mapa Europy"
            id="map-img-question"
          />
          <!-- Podczas pytania marker jest ukryty -->
        </div>
      </main>

      <footer class="quiz-footer">
        <p class="instruction-text">Zastanów się, a potem sprawdź odpowiedź.</p>
        <button class="btn-reveal" onclick="showAnswer()">Pokaż odpowiedź</button>
      </footer>

    </div>
  </div>

  <!-- ===================== EKRAN: ODPOWIEDŹ ===================== -->
  <div id="screen-answer" class="screen">
    <div class="quiz-layout">

      <header class="quiz-header answer-header">
        <button class="btn-back btn-back-answer" onclick="goToMenu()">← Menu</button>
        <div class="header-center">
          <span class="category-badge answer-badge" id="a-category-badge">—</span>
          <span class="progress-text" id="a-progress">1 / 10</span>
        </div>
        <div></div>
      </header>

      <div class="question-bar answer-bar">
        <span class="question-prefix">Odpowiedź:</span>
        <strong class="question-name" id="answer-name">— — —</strong>
      </div>

      <main class="map-area">
        <div class="map-wrapper" id="map-wrapper-answer">
          <img
            src="assets/maps/Europe_blank_map.png"
            class="map-img"
            alt="Mapa Europy"
            id="map-img-answer"
          />
          <!-- Marker pozycjonowany przez JS -->
          <div class="map-marker hidden" id="map-marker">
            <div class="marker-pulse" id="marker-pulse"></div>
            <div class="marker-dot"  id="marker-dot"></div>
            <div class="marker-label" id="marker-label"></div>
          </div>
        </div>
      </main>

      <footer class="quiz-footer answer-footer">
        <button class="btn-next" onclick="nextQuestion()">Następne pytanie →</button>
        <button class="btn-secondary" onclick="goToMenu()">Zmień kategorię</button>
      </footer>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
