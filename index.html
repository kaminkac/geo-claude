<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Europy — Quiz Geograficzny</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== EKRAN: MENU ===================== -->
  <div id="screen-menu" class="screen active">
    <div class="menu-container">
      <h1 class="app-title">Mapa Europy</h1>
      <p class="app-subtitle">Ćwiczenia z geografii</p>

      <div class="menu-card">
        <div class="menu-section">
          <label class="section-label">Wybierz kategorię</label>
          <div id="category-list" class="category-list">
            <!-- wypełniane przez JS -->
          </div>
        </div>

        <div class="menu-stats" id="menu-stats">
          <!-- statystyki sesji: liczba pytań itd. -->
        </div>

        <button class="btn-start" onclick="startQuiz()">Ćwicz!</button>
      </div>
    </div>
  </div>

  <!-- ===================== EKRAN: PYTANIE ===================== -->
  <div id="screen-question" class="screen">
    <div class="quiz-layout">

      <div class="quiz-panel">
        <div class="panel-top">
          <button class="btn-sm" onclick="goToMenu()">← Menu</button>
          <div class="panel-meta">
            <span class="cat-pill" id="q-category-badge">—</span>
            <span class="prog-text" id="q-progress">1/10</span>
          </div>
          <button class="btn-sm btn-muted" onclick="nextQuestion()">Pomiń →</button>
        </div>
        <div class="panel-bottom">
          <div class="q-text">
            <span class="q-prefix">Gdzie jest:</span>
            <strong class="q-name" id="question-name">— — —</strong>
          </div>
          <button class="btn-action" onclick="showAnswer()">Pokaż</button>
        </div>
      </div>

      <main class="map-area">
        <div class="map-wrapper">
          <img src="assets/maps/Europe_blank_map.png" class="map-img" alt="Mapa Europy" id="map-img-question" />
        </div>
      </main>

    </div>
  </div>

  <!-- ===================== EKRAN: ODPOWIEDŹ ===================== -->
  <div id="screen-answer" class="screen">
    <div class="quiz-layout">

      <div class="quiz-panel quiz-panel-answer">
        <div class="panel-top">
          <button class="btn-sm" onclick="goToMenu()">← Menu</button>
          <div class="panel-meta">
            <span class="cat-pill" id="a-category-badge">—</span>
            <span class="prog-text" id="a-progress">1/10</span>
          </div>
          <div></div>
        </div>
        <div class="panel-bottom">
          <div class="q-text">
            <span class="q-prefix">Odpowiedź:</span>
            <strong class="q-name" id="answer-name">— — —</strong>
          </div>
          <div class="answer-btns">
            <button class="btn-action" onclick="nextQuestion()">Następne →</button>
            <button class="btn-sm" onclick="goToMenu()">Zmień</button>
          </div>
        </div>
      </div>

      <main class="map-area">
        <div class="map-wrapper" id="map-wrapper-answer">
          <img src="assets/maps/Europe_blank_map.png" class="map-img" alt="Mapa Europy" id="map-img-answer" />
          <div class="map-marker hidden" id="map-marker">
            <div class="marker-pulse" id="marker-pulse"></div>
            <div class="marker-dot"  id="marker-dot"></div>
            <div class="marker-label" id="marker-label"></div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
